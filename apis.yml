name: Cratejoy
description: >-
  Cratejoy is a subscription-box commerce platform and marketplace (a CRV and Y
  Combinator company) that lets independent creators launch, sell, and manage recurring
  subscription boxes and one-time products. It exposes two public REST APIs: a Merchant
  API (https://api.cratejoy.com/v1/) covering customers, orders, subscriptions,
  shipments, products, inventory, carts, transactions, and webhooks; and a front-end
  Store API for reading and writing customer-scoped data from a storefront theme.
  Resources are JSON, authenticated with HTTP Basic credentials, paginated, filterable
  with double-underscore operators, and rate-limited with Retry-After.
