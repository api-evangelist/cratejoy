apis:
- name: Cratejoy Merchant API
  description: >-
    REST interface into most of the data and functionality of interest to Cratejoy
    merchants and developers: customers, orders, subscriptions, shipments, products,
    inventory, carts, transactions, addresses, stores, and webhooks. JSON throughout,
    HTTP Basic auth, page-number pagination, double-underscore filtering, 429 Retry-After.
  humanURL: https://docs.cratejoy.com/reference/introduction-1
  baseURL: https://api.cratejoy.com/v1/
